name: build-windows-installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 还原品牌资源（base64 → 二进制）
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("icon.ico", [Convert]::FromBase64String((Get-Content -Raw icon.ico.b64).Trim()))
          New-Item -ItemType Directory -Force brand | Out-Null
          [IO.File]::WriteAllBytes("brand/云极科技LOGO-图标.png", [Convert]::FromBase64String((Get-Content -Raw brand_logo.b64).Trim()))
          Get-ChildItem icon.ico, brand

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install PySide6 opencv-python-headless numpy shapely pytoshop qrcode pillow pyinstaller

      - name: 编译 EXE（PyInstaller onefile）
        run: pyinstaller build.spec --noconfirm

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 确保 NSIS 脚本为 UTF-8 with BOM（避免中文文件名解析乱码）
        shell: pwsh
        run: |
          python -c "p='installer.nsi'; s=open(p,encoding='utf-8').read(); open(p,'w',encoding='utf-8-sig').write(s)"
          Get-Content installer.nsi -TotalCount 3

      - name: 生成安装包
        shell: cmd
        run: |
          makensis /V2 installer.nsi
          dir /b

      - name: 上传构建产物（安装器 exe）
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: setup-yunji-v1.2.exe

      - name: 发布 Release 并上传 exe（双通道 + 错误落盘诊断）
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'setup-yunji-v1.2.exe';
            const assetName = 'setup-yunji-v1.2.exe';
            let rel;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag: 'v1.2' });
              rel = data;
              console.log('Release exists, id =', rel.id);
            } catch (e) {
              const { data: created } = await github.rest.repos.createRelease({ owner: context.repo.owner, repo: context.repo.repo, tag_name: 'v1.2', name: '云极智能拆版 V1.2', body: '云极智能拆版 V1.2 安装包（Windows）' });
              rel = created;
              console.log('Release created, id =', rel.id);
            }
            const buf = fs.readFileSync(path);
            console.log('Exe size =', buf.length);
            let ok = false;
            let lastErr = '';
            try {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.id,
                name: assetName,
                data: buf,
                headers: { 'content-type': 'application/octet-stream' }
              });
              ok = true;
              console.log('Asset uploaded via octokit');
            } catch (err) {
              lastErr = (err && (err.stack || err.message)) ? (err.stack || err.message).toString() : String(err);
              console.log('octokit upload failed:', lastErr.slice(0, 500));
            }
            if (!ok) {
              try {
                await github.request(`POST /repos/${context.repo.owner}/${context.repo.repo}/releases/${rel.id}/assets?name=${assetName}`, {
                  data: buf,
                  headers: { 'content-type': 'application/octet-stream', 'content-length': buf.length }
                });
                ok = true;
                console.log('Asset uploaded via raw API');
              } catch (err2) {
                lastErr = (err2 && (err2.stack || err2.message)) ? (err2.stack || err2.message).toString() : String(err2);
                console.log('raw API upload failed:', lastErr.slice(0, 500));
              }
            }
            if (!ok) {
              const diag = 'releaseId=' + rel.id + '\nsize=' + buf.length + '\nERR:\n' + lastErr;
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'debug-upload-error.txt',
                  message: 'debug upload error',
                  content: Buffer.from(diag).toString('base64')
                });
                console.log('debug file written');
              } catch (e3) {
                console.log('debug file write failed');
              }
              process.exitCode = 1;
            }
