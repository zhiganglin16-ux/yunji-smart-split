name: build-windows-installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 还原品牌资源（base64 → 二进制）
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("icon.ico", [Convert]::FromBase64String((Get-Content -Raw icon.ico.b64).Trim()))
          New-Item -ItemType Directory -Force brand | Out-Null
          [IO.File]::WriteAllBytes("brand/云极科技LOGO-图标.png", [Convert]::FromBase64String((Get-Content -Raw brand_logo.b64).Trim()))
          Get-ChildItem icon.ico, brand

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install PySide6 opencv-python-headless numpy shapely pytoshop qrcode pillow pyinstaller

      - name: 编译 EXE（PyInstaller onefile）
        run: pyinstaller build.spec --noconfirm

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 确保 NSIS 脚本为 UTF-8 with BOM（避免中文文件名解析乱码）
        shell: pwsh
        run: |
          python -c "p='installer.nsi'; s=open(p,encoding='utf-8').read(); open(p,'w',encoding='utf-8-sig').write(s)"
          Get-Content installer.nsi -TotalCount 3

      - name: 生成安装包
        shell: cmd
        run: |
          makensis /V2 installer.nsi
          dir /b

      - name: 上传构建产物（安装器 exe）
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: setup-yunji-v1.2.exe

      - name: 发布 Release（gh CLI 上传 exe）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.2 --yes --cleanup-tag 2>$null
          gh release create v1.2 "setup-yunji-v1.2.exe" --repo zhiganglin16-ux/yunji-smart-split --title "云极智能拆版 V1.2" --notes "云极智能拆版 V1.2 安装包（Windows）- 多码自动拆版 / 自动选码打样 - 左右袖前后片自动标注 - 小尺码标/每裁片二维码 - 版师点位/缝制线/矢量描边标准 - 图案层写死裁片形状蒙版 - 拆版总览按码分组"
