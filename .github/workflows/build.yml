name: build-windows-installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 还原品牌资源（base64 → 二进制）
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("icon.ico", [Convert]::FromBase64String((Get-Content -Raw icon.ico.b64).Trim()))
          New-Item -ItemType Directory -Force brand | Out-Null
          [IO.File]::WriteAllBytes("brand/云极科技LOGO-图标.png", [Convert]::FromBase64String((Get-Content -Raw brand_logo.b64).Trim()))
          Get-ChildItem icon.ico, brand

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install PySide6 opencv-python-headless numpy shapely pytoshop qrcode pillow pyinstaller

      - name: 编译 EXE（PyInstaller onefile）
        run: pyinstaller build.spec --noconfirm

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 确保 NSIS 脚本为 UTF-8 with BOM（避免中文文件名解析乱码）
        shell: pwsh
        run: |
          python -c "p='installer.nsi'; s=open(p,encoding='utf-8').read(); open(p,'w',encoding='utf-8-sig').write(s)"
          Get-Content installer.nsi -TotalCount 3

      - name: 生成安装包并发布 Release（一步完成）
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const ws = process.env.GITHUB_WORKSPACE || '.';
            execSync('makensis /V2 installer.nsi', { cwd: ws, stdio: 'inherit' });
            const exePath = path.join(ws, 'setup-yunji-v1.2.exe');
            const assetName = 'setup-yunji-v1.2.exe';
            const logs = [];
            const log = (s) => { logs.push(String(s)); console.log(s); };
            const owner = context.repo.owner, repo = context.repo.repo;
            let rel = null;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'v1.2' });
              rel = data; log('A got release ' + rel.id);
            } catch (e) {
              log('A getReleaseByTag err: ' + (e && (e.message || e.stack) || e).toString().slice(0, 300));
              try {
                const { data } = await github.rest.repos.createRelease({ owner, repo, tag_name: 'v1.2', name: '云极智能拆版 V1.2', body: '云极智能拆版 V1.2 安装包（Windows）' });
                rel = data; log('A created release ' + rel.id);
              } catch (e2) {
                log('A createRelease err: ' + (e2 && (e2.message || e2.stack) || e2).toString().slice(0, 300));
              }
            }
            let buf = null;
            try {
              buf = fs.readFileSync(exePath);
              log('B read exe size ' + buf.length);
            } catch (e3) {
              log('B readFileSync err: ' + (e3 && (e3.message || e3.stack) || e3).toString().slice(0, 300));
              try {
                log('B cwd files: ' + fs.readdirSync(ws).join(' | '));
              } catch (e3b) {
                log('B readdir err: ' + String(e3b).slice(0, 200));
              }
            }
            let ok = false;
            if (rel && buf) {
              try {
                await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id: rel.id, name: assetName, data: buf, headers: { 'content-type': 'application/octet-stream' } });
                ok = true; log('C uploaded via octokit');
              } catch (e4) {
                log('C octokit upload err: ' + (e4 && (e4.stack || e4.message) || e4).toString().slice(0, 800));
              }
              if (!ok) {
                try {
                  await github.request('POST /repos/{owner}/{repo}/releases/{release_id}/assets?name=' + assetName, { owner, repo, release_id: rel.id, data: buf, headers: { 'content-type': 'application/octet-stream', 'content-length': buf.length } });
                  ok = true; log('C uploaded via raw API');
                } catch (e5) {
                  log('C raw upload err: ' + (e5 && (e5.stack || e5.message) || e5).toString().slice(0, 800));
                }
              }
            } else {
              log('C skip upload, rel=' + !!rel + ' buf=' + !!buf);
            }
            try {
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: 'debug-upload-error.txt', message: 'debug', content: Buffer.from(logs.join('\n')).toString('base64') });
              log('D debug written');
            } catch (e6) {
              log('D debug write err: ' + (e6 && (e6.message || e6.stack) || e6).toString().slice(0, 300));
            }
            if (!ok) { process.exitCode = 1; }
