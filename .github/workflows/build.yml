name: build-windows-installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 还原品牌资源（base64 → 二进制）
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("icon.ico", [Convert]::FromBase64String((Get-Content -Raw icon.ico.b64).Trim()))
          New-Item -ItemType Directory -Force brand | Out-Null
          [IO.File]::WriteAllBytes("brand/云极科技LOGO-图标.png", [Convert]::FromBase64String((Get-Content -Raw brand_logo.b64).Trim()))

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install PySide6 opencv-python-headless numpy shapely pytoshop qrcode pillow pyinstaller

      - name: 编译 EXE（PyInstaller onefile）
        run: pyinstaller build.spec --noconfirm

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 确保 NSIS 脚本为 UTF-8 with BOM
        shell: pwsh
        run: |
          python -c "p='installer.nsi'; s=open(p,encoding='utf-8').read(); open(p,'w',encoding='utf-8-sig').write(s)"

      - name: 生成安装包（makensis 定位诊断）
        shell: pwsh
        run: |
          $diag = @()
          $candidates = @('makensis','C:\ProgramData\chocolatey\bin\makensis.exe','C:\Program Files (x86)\NSIS\makensis.exe','C:\Program Files\NSIS\makensis.exe')
          $mkPath = $null
          foreach ($c in $candidates) {
            $cmd = Get-Command $c -ErrorAction SilentlyContinue
            if ($cmd) { $mkPath = $cmd.Source; break }
            if (Test-Path $c) { $mkPath = $c; break }
          }
          $diag += "PATH=$env:PATH"
          $diag += "USING_MAKENSIS=$mkPath"
          $diag += "CHOCO_SHIM=$(Test-Path 'C:\ProgramData\chocolatey\bin\makensis.exe')"
          $diag += "PF86=$(Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')"
          $diag += "PF=$(Test-Path 'C:\Program Files\NSIS\makensis.exe')"
          $diag | Out-File -Encoding utf8 mk_diag.txt
          if (-not $mkPath) {
            $diag += "MAKENSIS_NOT_FOUND"
            $diag | Out-File -Encoding utf8 mk_diag.txt
            Write-Host "MAKENSIS NOT FOUND"
            exit 1
          }
          & $mkPath /V2 installer.nsi 2>&1 | Tee-Object -FilePath mk_makensis_out.txt
          $code = $LASTEXITCODE
          "MAKENSIS_EXIT=$code" | Out-File -Append -Encoding utf8 mk_diag.txt
          Get-ChildItem *.exe | ForEach-Object { "FILE: $($_.Name) SIZE: $($_.Length)" | Out-File -Append -Encoding utf8 mk_diag.txt }
          Write-Host "MAKENSIS_EXIT=$code"
          exit $code

      - name: 发布 Release 并上传 exe（curl API）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "zhiganglin16-ux/yunji-smart-split"
          $exe = "setup-yunji-v1.2.exe"
          if (-not (Test-Path $exe)) {
            $mkDiag = ""
            if (Test-Path mk_diag.txt) { $mkDiag = Get-Content -Raw mk_diag.txt }
            if (Test-Path mk_makensis_out.txt) { $mkDiag += "`n---MAKENSIS OUT---`n" + (Get-Content -Raw mk_makensis_out.txt) }
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($mkDiag))
            $body = @{ message = "diag"; content = $b64 } | ConvertTo-Json -Compress
            curl.exe -s -X PUT -H "Authorization: token $env:GH_TOKEN" -H "Content-Type: application/json" -d $body "https://api.github.com/repos/$repo/contents/debug-makensis.txt" | Out-Null
            Write-Host "EXE NOT FOUND - diagnostic pushed"
            exit 1
          }
          $size = (Get-Item $exe).Length
          Write-Host "EXE SIZE: $size"
          $relJson = curl.exe -s -H "Authorization: token $env:GH_TOKEN" "https://api.github.com/repos/$repo/releases/tags/v1.2"
          $rel = $relJson | ConvertFrom-Json
          $relId = $rel.id
          if (-not $relId) {
            Write-Host "Creating release..."
            $body = '{"tag_name":"v1.2","name":"云极智能拆版 V1.2","body":"云极智能拆版 V1.2 安装包（Windows）"}'
            $createJson = curl.exe -s -X POST -H "Authorization: token $env:GH_TOKEN" -H "Content-Type: application/json" -d $body "https://api.github.com/repos/$repo/releases"
            $rel2 = $createJson | ConvertFrom-Json
            $relId = $rel2.id
            if (-not $relId) { Write-Host "CREATE RELEASE FAILED: $createJson"; exit 1 }
          }
          Write-Host "RELEASE ID: $relId"
          $uploadOut = curl.exe -s -X POST -H "Authorization: token $env:GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary "@$exe" "https://uploads.github.com/repos/$repo/releases/$relId/assets?name=setup-yunji-v1.2.exe"
          Write-Host "UPLOAD RESP: $uploadOut"
          $up = $uploadOut | ConvertFrom-Json
          if ($up.id) { Write-Host "ASSET UPLOADED: $($up.name) size=$($up.size)" } else { Write-Host "ASSET UPLOAD FAILED"; exit 1 }
